/* Layout: 6コマのイラストを冒頭に置き、会話はイラストと同じ吹き出しで読ませる単一カラム。 */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --fg:#262A31; --muted:#646A73; --line:#DAD6CC; --ink:#2B2E35;
  --accent:#3C6EA6; --accent-soft:#E3ECF6; --accent-fg:#FFFFFF;
  --mint:#2F8F7C; --mint-soft:#DDF0EA;
  --good:#2F7D5B; --good-soft:#E1F1E8; --warn:#A56A12; --warn-soft:#F6EBD4; --bad:#B04A3A; --bad-soft:#F7E3DF;
  --r:14px;
  --font-title:"TitleFont","Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181C; --surface:#1F2329; --fg:#E7E9ED; --muted:#9AA1AB; --line:#2E343C; --ink:#C9CED6;
    --accent:#8FB6E6; --accent-soft:#222F40; --accent-fg:#0F1A28;
    --mint:#6CC3B0; --mint-soft:#1D3530;
    --good:#6CC49A; --good-soft:#1B3328; --warn:#E0B05A; --warn-soft:#3A2E16; --bad:#E58C7B; --bad-soft:#3B221E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181C; --surface:#1F2329; --fg:#E7E9ED; --muted:#9AA1AB; --line:#2E343C; --ink:#C9CED6;
  --accent:#8FB6E6; --accent-soft:#222F40; --accent-fg:#0F1A28;
  --mint:#6CC3B0; --mint-soft:#1D3530;
  --good:#6CC49A; --good-soft:#1B3328; --warn:#E0B05A; --warn-soft:#3A2E16; --bad:#E58C7B; --bad-soft:#3B221E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15.5px; line-height:1.85;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:44rem;margin:0 auto}
.eyebrow{font-size:.75rem;letter-spacing:.14em;color:var(--muted);margin:0}
h1{font-family:var(--font-display);font-weight:700;font-size:1.9rem;line-height:1.35;margin:4px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.9rem}
nav.tabs{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--bg);
  display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
  padding-block:10px; margin-block:12px 18px; border-bottom:1px solid var(--line);
}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none; font:inherit; font-size:.88rem; line-height:1; padding:10px 14px; position:relative;
  border:1px solid var(--line); background:var(--surface); color:var(--fg); border-radius:8px; cursor:pointer;
}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tab.done::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--good);position:absolute;top:4px;right:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--font-display);font-weight:700;font-size:1.5rem;line-height:1.4;margin:2px 0 6px;text-wrap:balance}
h3{font-size:1rem;margin:0}
p{margin:0}
.lede{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:12px}
.points{margin:10px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.points li::marker{color:var(--accent)}
ol.how{margin:10px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.small{font-size:.82rem;color:var(--muted)}
.btn{
  font:inherit; font-weight:500; padding:10px 18px; border-radius:8px; cursor:pointer;
  background:var(--accent); color:var(--accent-fg); border:1px solid var(--accent);
}

<script>
(function(){
'use strict';

function h(tag, props){
  var e=document.createElement(tag);
  if(props){
    Object.keys(props).forEach(function(k){
      var v=props[k];
      if(v===false||v==null) return;
      if(k==='class') e.className=v;
      else if(k==='text') e.textContent=v;
      else if(k==='style') e.style.cssText=v;
      else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
      else e.setAttribute(k, v===true?'':v);
    });
  }
  for(var i=2;i<arguments.length;i++){
    var kid=arguments[i];
    if(kid==null||kid===false) continue;
    if(Array.isArray(kid)){ kid.forEach(function(x){ if(x!=null&&x!==false) e.append(x.nodeType?x:document.createTextNode(x)); }); }
    else e.append(kid.nodeType?kid:document.createTextNode(kid));
  }
  return e;
}
function shuffle(a){
  var r=a.slice();
  for(var i=r.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=r[i]; r[i]=r[j]; r[j]=t; }
  return r;
}
function meter(lv){
  var m=h('span',{class:'meter lv'+lv,'aria-label':'連想の広がり '+lv+'/5',role:'img'});
  for(var i=1;i<=5;i++) m.append(h('i',{class:i<=lv?'on':''}));
  return m;
}


var chip=function(labels,ans){ return labels.map(function(l){ return {t:l,ok:l===ans}; }); };


/* ---------- quiz runner ---------- */
function leadBlock(item){
  var isT=item.who==='therapist';
  var wrap=h('div',{class:'say '+(isT?'therapist':'patient')});
  if(item.ctx) wrap.append(h('div',{class:'ctx',text:'患者：'+item.ctx}));
  wrap.append(h('div',{class:'who',text:isT?'治療者':'患者'}), h('div',{class:'line',text:item.lead}));
  return wrap;
}

function runQuiz(set, mount, onDone){
  var idx=0, score=0, timer=null;
  function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }

  function showItem(){
    clearTimer();
    mount.replaceChildren();
    var total=set.items.length;
    var item=set.items[idx];
    var chips=set.mode==='chips';
    var options=item.options||chip(set.labels,item.ans);
    var list=chips?options:shuffle(options);

    var fill=h('i'); fill.style.width=(idx/total*100)+'%';
    var progressBar=h('div',{class:'bar'},fill);
    var head=h('div',{class:'qhead'},h('span',{text:set.title}),h('span',{text:'問 '+(idx+1)+' / '+total}));
    var lead=leadBlock(item);
    var q=h('p',{class:'q',text:set.q});
    var opts=h('div',{class:chips?'opts chips':'opts'});
    var feedback=h('div',{class:'feedback',hidden:true});
    var next=h('button',{type:'button',class:'btn',hidden:true,text:idx<total-1?'次へ':'結果を見る',onclick:function(){
      idx++; if(idx<total) showItem(); else showResult();
    }});
    var pairs=[];
    var answered=false;

    list.forEach(function(o){
      var b=h('button',{type:'button',class:'opt'},h('span',{text:o.t}));
      pairs.push([b,o]);
      b.addEventListener('click',function(){
        if(answered) return;
        answered=true;
        if(o.ok) score++;
        pairs.forEach(function(p){
          var btn=p[0], op=p[1];
          btn.disabled=true;
          if(op.ok) btn.classList.add('is-ok');
          if(btn===b){ btn.classList.add('is-chosen'); if(!op.ok) btn.classList.add('is-miss'); }
          if(!chips && op.note){
            btn.append(h('div',{class:'note'},h('b',{text:(op.ok?'◎ ':'△ ')+(op.tag||'')+'　'}),op.note));
          }
        });
        if(chips){
          var right=options.filter(function(x){return x.ok;})[0];
          feedback.hidden=false;
          feedback.append(h('b',{text:o.ok?'そのとおりです。':'答えは「'+right.t+'」です。'}),item.explain);
        }
        next.hidden=false;
        next.focus({preventScroll:true});
      });
      opts.append(b);
    });

    mount.append(progressBar,head,lead);

    if(item.pause){
      var pf=h('i');
      var track=h('div',{class:'pause'},pf);
      var label=h('span',{class:'small',text:'まず、聴く。'});
      var skip=h('button',{type:'button',class:'link',text:'待たずに選ぶ'});
      var pbox=h('div',{class:'stack',style:'gap:6px'},track,h('div',{class:'between'},label,skip));
      opts.classList.add('locked');
      var unlock=function(){ clearTimer(); opts.classList.remove('locked'); pbox.hidden=true; };
      skip.addEventListener('click',unlock);
      mount.append(pbox);
      void pf.offsetWidth;
      pf.style.transitionDuration=item.pause+'s';
      pf.style.width='100%';
      timer=setTimeout(unlock,item.pause*1000);
    }

    mount.append(q,opts,feedback,next);
  }

  function showResult(){
    clearTimer();
    var total=set.items.length;
    var msg=score===total?'全問、判断を足さずに受け取れています。'
      :score/total>=0.7?'おおむね見分けられています。外れた問いの説明を、もう一度読んでみてください。'
      :'まだ迷いやすいところです。選択肢の説明を読みながら、もう一度試すと感覚がつかめます。';
    mount.replaceChildren(
      h('div',{class:'stack'},
        h('p',{class:'small',text:set.title+'　結果'}),
        h('div',{class:'score',text:score+' / '+total}),
        h('p',{text:msg}),
        h('p',{class:'small',text:'正解の数よりも、なぜそう響くのかを自分の言葉で言えることが大切です。'}),
        h('div',{class:'row'},
          h('button',{type:'button',class:'btn',text:'もう一度',onclick:function(){ idx=0; score=0; showItem(); }})
        )
      )
    );
    onDone(score,total);
  }

  showItem();
}

  ]}
};

    ]},

      {t:'値打ちがあるのか、と思ってしまうほど、つらいんですね。',ok:true,tag:'共感・言語化（例）',note:'本音の問いに答えを出そうとせず、問いが出てくるほどのつらさを受け取っている。パートAでは、ここで返答できなくなった。'},
      {t:'ありますよ、きっと。元気になれば家に帰れます。',ok:false,tag:'安請け合い（例）',note:'まだ確かではないことを保証している。患者は、聴かれていないと感じやすい。'},
      {t:'そんなこと言わずに、がんばりましょう。',ok:false,tag:'励まし（例）',note:'すでに我慢している人に、さらに頑張りを求めている。'},
      {t:'治らないとは限りませんよ。先生もそうは言っていません。',ok:false,tag:'事実による否定（例）',note:'事実としては正しくても、患者の気持ちを訂正する形になっている。'}
    ]},
    {who:'patient',lead:'どうせ良くならないなら、そんなに長いことここにいてもしょうがないし、ぶすぶす点滴刺されて、こんな物一生食っていくくらいなら死んだほうがましだよ。我慢ばかりして細々生きてくくらいなら、酒飲んで一気に逝っちまいたいなー、なんてさ。',options:[
      {t:'今日はだいぶ疲れましたものね、いろいろ考えてしまって……。そんなふうに思ったり、ふっと、そういう太く短いほうを選びたくなることがあるんでしょうね……。',ok:true,tag:'共感・言語化（パートB）',note:'極端な言葉を叱らず、勧めもせず、気持ちとして受け取っている。実際の臨床では、受け止めたうえで、状況に応じて死にたい気持ちの強さを確かめる場面もある。'},
      {t:'そんな無茶なことを言わないでください。命を粗末にしてはいけません。',ok:false,tag:'叱責・説教（例）',note:'本音を語った直後に咎められると、患者は口を閉ざしやすい。'},
      {t:'お酒は絶対だめですよ。肝臓にいちばん悪いんですから。',ok:false,tag:'正論で返す（例）',note:'医学的には正しいが、患者が語りたいことは別のところにある。'},

/* ---------- transcript helpers ---------- */
function lineBlock(l){
  var isNs=l.w==='ns';
  var wrap=h('div',{class:'say '+(isNs?'therapist':'patient')});
  wrap.append(h('div',{class:'who',text:isNs?'看護師（Ns）':'患者（Pt）'}),h('div',{class:'line'+(l.silent?' silent':''),text:l.t}));
  return wrap;
}
function seg(sel,onChange){
  var keys=['A','B'];
  var wrap=h('div',{class:'seg',role:'group','aria-label':'パートの切り替え'});
  keys.forEach(function(k){
    var b=h('button',{type:'button','aria-pressed':String(sel===k)},h('span',{text:PARTS[k].name}),h('small',{text:PARTS[k].sub}));
    b.addEventListener('click',function(){
      if(sel===k) return;
      sel=k;
      Array.prototype.forEach.call(wrap.children,function(c,i){ c.setAttribute('aria-pressed',String(keys[i]===sel)); });
      onChange(sel);
    });
    wrap.append(b);
  });
  return wrap;
}

/* ---------- read-through runner (読み解く) ---------- */
function runRead(part,mount,onDone){
  var lines=part.lines, p=0, qn=0, score=0, total=0;
  function isQ(l){ return !!(l.tag||l.lv!=null); }
  lines.forEach(function(l){ if(isQ(l)) total++; });
  var log=h('div',{class:'stack tr'});
  var qbox=h('div',{class:'card stack'});
  mount.replaceChildren(log,qbox);

  function advance(){
    while(p<lines.length && !isQ(lines[p])){
      log.append(lineBlock(lines[p]));
      if(lines[p].silent) log.append(h('p',{class:'note',text:lines[p].ex}));
      p++;
    }
    if(p>=lines.length){ finish(); return; }
    ask(lines[p]);
  }

  function ask(l){
    var isNs=l.w==='ns';
    var labels=isNs?NS_LABELS:PT_LABELS;
    var ans=isNs?l.tag:PT_LABELS[l.lv];
    var fill=h('i'); fill.style.width=(qn/total*100)+'%';
    var opts=h('div',{class:'opts chips'});
    var fb=h('div',{class:'feedback',hidden:true});
    var next=h('button',{type:'button',class:'btn',hidden:true,text:'次へ',onclick:function(){
      log.append(lineBlock(l)); p++; qn++; advance();
    }});
    var answered=false, pairs=[];
    labels.forEach(function(lab){
      var b=h('button',{type:'button',class:'opt',text:lab});
      pairs.push([b,lab]);
      b.addEventListener('click',function(){
        if(answered) return;
        answered=true;
        var ok=lab===ans;
        if(ok) score++;
        pairs.forEach(function(pr){
          pr[0].disabled=true;
          if(pr[1]===ans) pr[0].classList.add('is-ok');
          if(pr[0]===b){ pr[0].classList.add('is-chosen'); if(!ok) pr[0].classList.add('is-miss'); }
        });
        fb.hidden=false;
        fb.append(h('b',{text:ok?'そのとおりです。':'答えは「'+ans+'」です。'}),l.ex);
        if(!isNs) fb.append(h('div',{class:'row',style:'margin-top:6px'},h('span',{class:'small',text:'患者の話の広がり'}),meter(PT_LEVEL[l.lv])));
        next.hidden=false;
        next.focus({preventScroll:true});
      });
      opts.append(b);
    });
    qbox.replaceChildren(
      h('div',{class:'bar'},fill),
      h('div',{class:'qhead'},h('span',{text:part.name+'　'+part.sub}),h('span',{text:'問 '+(qn+1)+' / '+total})),
      lineBlock(l),
      h('p',{class:'q',text:isNs?'この返答は、どのタイプですか。':'この患者の反応は、どうでしたか。'}),
      opts,fb,next
    );
  }

  function finish(){
    var rows=[];
    lines.forEach(function(l,i){
      if(l.lv!=null) rows.push({text:lines[i-1].tag+' → '+PT_LABELS[l.lv],lv:PT_LEVEL[l.lv]});
    });
    var msg=part.key==='A'
      ?'パートAでは、説明や確認が続いても、患者の話はあまり広がらず、最後は返答に詰まりました。'
      :'パートBでは、受け止めと具体的な問いを重ねるうちに、患者が自分から話を深めていきました。';
    var actions=[h('button',{type:'button',class:'btn ghost',text:'もう一度',onclick:function(){ p=0; qn=0; score=0; log.replaceChildren(); advance(); }})];
    if(part.key==='A') actions.unshift(h('button',{type:'button',class:'btn',text:'パートBを読み解く',onclick:function(){ go('read',{part:'B'}); }}));
    else actions.unshift(h('button',{type:'button',class:'btn',text:'まとめへ',onclick:function(){ go('sum'); }}));
    qbox.replaceChildren(
      h('p',{class:'small',text:part.name+'　'+part.sub+'　結果'}),
      h('div',{class:'score',text:score+' / '+total}),
      h('p',{text:msg}),
      h('ul',{class:'timeline'},rows.map(function(r){ return h('li',{},h('span',{class:'tl-t',text:r.text}),meter(r.lv)); })),
      h('div',{class:'row'},actions)
    );
    onDone(score,total);
  }

  advance();
}

/* ---------- views ---------- */
var main=document.getElementById('main');
var tabsEl=document.getElementById('tabs');
var TABS=[{id:'scene',label:'場面'},{id:'read',label:'読み解く'},{id:'practice',label:'返し方'},{id:'sum',label:'まとめ'}];
var current='scene';
var readPart='A';

function isTabDone(id){
  if(id==='read') return !!(progress.readA&&progress.readA.done&&progress.readB&&progress.readB.done);
  if(id==='practice') return !!(progress.practice&&progress.practice.done);
  return false;
}
function paintTabs(){
  tabsEl.replaceChildren();
  TABS.forEach(function(t){
    var b=h('button',{type:'button',class:'tab'+(isTabDone(t.id)?' done':''),text:t.label,onclick:function(){ go(t.id); }});
    if(t.id===current) b.setAttribute('aria-current','page');
    tabsEl.append(b);
  });
}
function go(id,opt){
  if(opt&&opt.part) readPart=opt.part;
  current=id;
  paintTabs();
  main.replaceChildren(id==='scene'?viewScene():id==='read'?viewRead():id==='practice'?viewPractice():viewSum());
  window.scrollTo(0,0);
}

function viewScene(){
  var sel='A';
  var tr=h('div',{class:'stack tr'});
  var cap=h('p',{class:'small'});
  function paint(){
    tr.replaceChildren();
    PARTS[sel].lines.forEach(function(l){ tr.append(lineBlock(l)); });
    cap.textContent=PARTS[sel].name+'　'+PARTS[sel].sub+'：'+PARTS[sel].cap;
  }
  paint();
  return h('section',{class:'stack'},
    h('div',{},h('img',{class:'hero-img',src:'scene.jpg',width:1536,height:1024,alt:'ベッドで検温を受ける患者と、声をかける看護師を描いた6コマのイラスト。患者が「もう生きてるのいやんなっちゃったよ」と話しかけ、看護師が驚いて問い返す。'}),h('p',{class:'hero-cap',text:'イラストは、パートAの冒頭の流れを描いたものです。'})),
    h('div',{},h('p',{class:'eyebrow',text:'傾聴と共感のトレーニング'}),h('h2',{},'ベッドサイドの',h('span',{class:'num',text:'5'}),'分間'),h('p',{class:'lede',text:'同じ場面を、2通りの対応で読み比べる。'})),
    h('div',{class:'card'},h('h3',{text:'状況設定'}),h('p',{style:'margin-top:6px',text:SETTING})),
    seg(sel,function(k){ sel=k; paint(); }),
    h('div',{class:'card stack'},cap,tr),
    h('div',{class:'row'},h('button',{type:'button',class:'btn',text:'読み解いてみる',onclick:function(){ go('read',{part:sel}); }}))
  );
}

function viewRead(){
  var mount=h('div',{class:'stack'});
  function start(k){
    readPart=k;
    runRead(PARTS[k],mount,function(score,total){
      var key='read'+k;
      var p=progress[key]||{};
      progress[key]={done:true,best:Math.max(p.best||0,score),total:total};
      save(); paintTabs();
    });
  }
  var page=h('section',{class:'stack'},
    h('div',{},h('p',{class:'eyebrow',text:'一行ずつ'}),h('h2',{text:'読み解く'}),h('p',{class:'lede',text:'看護師の返答のタイプと、患者の話の広がりを見極める。'})),
    h('div',{class:'card'},h('p',{text:'会話を一行ずつ進めます。看護師の返答はタイプを、患者の反応は話の広がりを選んでください。パートAから読むと、比べやすくなります。'})),
    seg(readPart,function(k){ start(k); }),
    mount
  );
  start(readPart);
  return page;
}

function viewPractice(){
  var set=PRACTICE;
  var status=h('span',{class:'chip'});
  var body=h('div',{class:'stack',style:'margin-top:12px'});
  function paint(){
    var p=progress.practice;
    status.textContent=p&&p.done?('完了　最高 '+p.best+'/'+p.total):'未着手';
    status.className='chip'+(p&&p.done?' done':'');
  }
  var startBtn=h('button',{type:'button',class:'btn',text:'はじめる',onclick:function(){
    startBtn.remove();
    runQuiz(set,body,function(score,total){
      var p=progress.practice||{};
      progress.practice={done:true,best:Math.max(p.best||0,score),total:total};
      save(); paint(); paintTabs();
    });
  }});
  body.append(startBtn);
  paint();
  return h('section',{class:'stack'},
    h('div',{},h('p',{class:'eyebrow',text:'自分なら'}),h('h2',{text:'返し方を考える'}),h('p',{class:'lede',text:'会話の途中の場面で、返答を選ぶ。'})),
    h('div',{class:'card'},
      h('div',{class:'between'},h('h3',{text:set.title}),status),
      h('p',{class:'small',text:set.intro}),
      body
    )
  );
}

function viewSum(){
  function tl(part){
    var rows=[];
    part.lines.forEach(function(l,i){
      if(l.lv!=null) rows.push(h('li',{},h('span',{class:'tl-t',text:lines_tag(part,i)+' → '+PT_LABELS[l.lv]}),meter(PT_LEVEL[l.lv])));
    });
    if(part.lines[part.lines.length-1].silent) rows.push(h('li',{},h('span',{class:'tl-t',text:'説明・説得のあと → 返答できず沈黙'}),meter(1)));
    return rows;
  }
  function lines_tag(part,i){ return part.lines[i-1].tag; }
  return h('section',{class:'stack'},
    h('div',{},h('p',{class:'eyebrow',text:'読み比べる'}),h('h2',{text:'まとめ'}),h('p',{class:'lede',text:'返答のタイプと、そのあとの患者の反応。'})),
    h('div',{class:'cols'},
      h('div',{class:'card'},h('h3',{text:'パートA　通常対応'}),h('ul',{class:'timeline'},tl(PARTS.A)),h('p',{class:'note',text:'善意の質問と説明が続き、患者の気持ちは受け取られないまま、行き詰まった。'})),
      h('div',{class:'card'},h('h3',{text:'パートB　傾聴と共感を意識した対応'}),h('ul',{class:'timeline'},tl(PARTS.B)),h('p',{class:'note',text:'言われたことを受け取り、具体的に尋ねるうちに、患者が自分から本音を語り、がんばれるという感じ方に動いた。'}))
    ),
    h('div',{class:'card'},h('h3',{text:'アドバイス'}),h('ul',{class:'points'},
      h('li',{text:'患者の悲観や失望に出会うと、善意から、それを良い方向へ変えようとしがち。しかしそれが、かえって患者の気持ちを否定的なところに留めてしまうことがある。'}),
      h('li',{text:'傾聴と共感の大きな意義の一つは、相手が次第に、自分でより建設的な感じ方をし始めること。答えを急がなくてよい。安心できて信頼できるやりとりがあれば、患者が自分の中に、より望ましい答えを見つけることも少なくない。'})
    )),
    h('div',{class:'card'},h('h3',{text:'返す前に、自問する'}),h('ul',{class:'points'},
      h('li',{text:'いま、患者の気持ちを良い方向へ変えようとしていないか。'}),
      h('li',{text:'答えを急いでいないか。'}),
      h('li',{text:'言われたことを受け取ってから、具体的に尋ねているか。'})
    )),
    h('div',{class:'callout'},h('b',{text:'補足（この教材の外）'}),'パートBは、死にたい気持ちの話題を避けた対応ではありません。実際の臨床では、受け止めたうえで、状況に応じてその気持ちの強さや具体性を確かめ、必要なら医師や医療チームと共有します。この教材では、その部分は扱っていません。')
  );
}

go('scene');

})();
