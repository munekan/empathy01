/* ---------- quiz runner ---------- */
function leadBlock(item){
  var isT=item.who==='therapist';
  var wrap=h('div',{class:'say '+(isT?'therapist':'patient')});
  if(item.ctx) wrap.append(h('div',{class:'ctx',text:'患者：'+item.ctx}));
  wrap.append(h('div',{class:'who',text:isT?'治療者':'患者'}), h('div',{class:'line',text:item.lead}));
  return wrap;
}

function runQuiz(set, mount, onDone){
  var idx=0, score=0, timer=null;
  function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }

  function showItem(){
    clearTimer();
    mount.replaceChildren();
    var total=set.items.length;
    var item=set.items[idx];
    var chips=set.mode==='chips';
    var options=item.options||chip(set.labels,item.ans);
    var list=chips?options:shuffle(options);

    var fill=h('i'); fill.style.width=(idx/total*100)+'%';
    var progressBar=h('div',{class:'bar'},fill);
    var head=h('div',{class:'qhead'},h('span',{text:set.title}),h('span',{text:'問 '+(idx+1)+' / '+total}));
    var lead=leadBlock(item);
    var q=h('p',{class:'q',text:set.q});
    var opts=h('div',{class:chips?'opts chips':'opts'});
    var feedback=h('div',{class:'feedback',hidden:true});
    var next=h('button',{type:'button',class:'btn',hidden:true,text:idx<total-1?'次へ':'結果を見る',onclick:function(){
      idx++; if(idx<total) showItem(); else showResult();
    }});
    var pairs=[];
    var answered=false;

    list.forEach(function(o){
      var b=h('button',{type:'button',class:'opt'},h('span',{text:o.t}));
      pairs.push([b,o]);
      b.addEventListener('click',function(){
        if(answered) return;
        answered=true;
        if(o.ok) score++;
        pairs.forEach(function(p){
          var btn=p[0], op=p[1];
          btn.disabled=true;
          if(op.ok) btn.classList.add('is-ok');
          if(btn===b){ btn.classList.add('is-chosen'); if(!op.ok) btn.classList.add('is-miss'); }
          if(!chips && op.note){
            btn.append(h('div',{class:'note'},h('b',{text:(op.ok?'◎ ':'△ ')+(op.tag||'')+'　'}),op.note));
          }
        });
        if(chips){
          var right=options.filter(function(x){return x.ok;})[0];
          feedback.hidden=false;
          feedback.append(h('b',{text:o.ok?'そのとおりです。':'答えは「'+right.t+'」です。'}),item.explain);
        }
        next.hidden=false;
        next.focus({preventScroll:true});
      });
      opts.append(b);
    });

    mount.append(progressBar,head,lead);

    if(item.pause){
      var pf=h('i');
      var track=h('div',{class:'pause'},pf);
      var label=h('span',{class:'small',text:'まず、聴く。'});
      var skip=h('button',{type:'button',class:'link',text:'待たずに選ぶ'});
      var pbox=h('div',{class:'stack',style:'gap:6px'},track,h('div',{class:'between'},label,skip));
      opts.classList.add('locked');
      var unlock=function(){ clearTimer(); opts.classList.remove('locked'); pbox.hidden=true; };
      skip.addEventListener('click',unlock);
      mount.append(pbox);
      void pf.offsetWidth;
      pf.style.transitionDuration=item.pause+'s';
      pf.style.width='100%';
      timer=setTimeout(unlock,item.pause*1000);
    }

    mount.append(q,opts,feedback,next);
  }

  function showResult(){
    clearTimer();
    var total=set.items.length;
    var msg=score===total?'全問、判断を足さずに受け取れています。'
      :score/total>=0.7?'おおむね見分けられています。外れた問いの説明を、もう一度読んでみてください。'
      :'まだ迷いやすいところです。選択肢の説明を読みながら、もう一度試すと感覚がつかめます。';
    mount.replaceChildren(
      h('div',{class:'stack'},
        h('p',{class:'small',text:set.title+'　結果'}),
        h('div',{class:'score',text:score+' / '+total}),
        h('p',{text:msg}),
        h('p',{class:'small',text:'正解の数よりも、なぜそう響くのかを自分の言葉で言えることが大切です。'}),
        h('div',{class:'row'},
          h('button',{type:'button',class:'btn',text:'もう一度',onclick:function(){ idx=0; score=0; showItem(); }})
        )
      )
    );
    onDone(score,total);
  }

  showItem();
}

function illu(name,cls){
  var d=ILL[name];
  var box=document.createElement('div');
  box.className='ill '+(cls||'');
  box.innerHTML='<svg viewBox="'+d.vb+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+d.label+'">'+d.body+'</svg>';
  return box;
}
var FIG={empathy:['sympathy','同情と共感の違い'],wonder:['wonderfig','患者自身にも不思議がってもらう']};

/* ---------- views ---------- */
var main=document.getElementById('main');
var tabsEl=document.getElementById('tabs');
var TABS=[
  {id:'home',label:'はじめに'},
  {id:'listen',label:'傾聴'},
  {id:'empathy',label:'共感'},
  {id:'wonder',label:'不思議に思う'},
  {id:'work',label:'介入'},
  {id:'sim',label:'面接'}
];
var current='home';

function moduleDone(m){
  return m.sets.every(function(s){ return progress[s.id]&&progress[s.id].done; });
}
function isTabDone(id){
  if(id==='home') return false;
  if(id==='sim') return !!(progress.sim&&progress.sim.done);
  var m=MODULES.filter(function(x){return x.id===id;})[0];
  return m?moduleDone(m):false;
}
function paintTabs(){
  tabsEl.replaceChildren();
  TABS.forEach(function(t){
    var b=h('button',{type:'button',class:'tab'+(isTabDone(t.id)?' done':''),text:t.label,onclick:function(){ go(t.id); }});
    if(t.id===current) b.setAttribute('aria-current','page');
    tabsEl.append(b);
  });
}
function go(id){
  current=id;
  paintTabs();
  main.replaceChildren(id==='home'?viewHome():id==='sim'?viewSim():viewModule(MODULES.filter(function(x){return x.id===id;})[0]));
  window.scrollTo(0,0);
}

function viewHome(){
  var cards=MODULES.map(function(m){
    var done=m.sets.filter(function(s){return progress[s.id]&&progress[s.id].done;}).length;
    return h('div',{class:'card stack',style:'gap:8px'},
      h('div',{class:'between'},h('h3',{text:m.name}),h('span',{class:'chip'+(done===m.sets.length?' done':''),text:done+' / '+m.sets.length+' セット'})),
      h('p',{class:'small',text:m.lead}),
      h('div',{class:'row'},h('button',{type:'button',class:'btn ghost',text:'はじめる',onclick:function(){ go(m.id); }}))
    );
  });
  var simDone=progress.sim&&progress.sim.done;
  cards.push(h('div',{class:'card stack',style:'gap:8px'},
    h('div',{class:'between'},h('h3',{text:'面接シミュレーション'}),h('span',{class:'chip'+(simDone?' done':''),text:simDone?'完了':'未着手'})),
    h('p',{class:'small',text:'5つの場面で一言を選び、患者の連想がどう動くかを見る。'}),
    h('div',{class:'row'},h('button',{type:'button',class:'btn ghost',text:'はじめる',onclick:function(){ go('sim'); }}))
  ));
  return h('section',{class:'stack'},
    h('div',{class:'card'},
      illu('hero','hero-ill'),
      h('h2',{text:'4つの柱を、場面で確かめる'}),
      h('p',{class:'lede',text:'「傾聴と共感メモ」の4つの柱を、短い場面に応えながら体験する教材です。'}),
      h('ol',{class:'how'},
        h('li',{text:'章の要点を読む'}),
        h('li',{text:'場面ごとに応答を選び、解説を読む'}),
        h('li',{text:'最後に面接シミュレーションで通して試す'})
      )
    ),
    h('div',{class:'grid'},cards),
    h('p',{class:'small',text:'台詞と症例は学習用に作った架空のものです。正解は一つの型ではなく、判断を足さずに受け取れているか、患者の仕事が増えるか、という視点で示しています。進み具合は、この端末のブラウザにだけ保存されます。'})
  );
}

function setCard(set){
  var status=h('span',{class:'chip'});
  var body=h('div',{class:'stack',style:'margin-top:12px'});
  function paint(){
    var p=progress[set.id];
    status.textContent=p&&p.done?('完了　最高 '+p.best+'/'+p.total):'未着手';
    status.className='chip'+(p&&p.done?' done':'');
  }
  var startBtn=h('button',{type:'button',class:'btn',text:'はじめる',onclick:function(){
    startBtn.remove();
    runQuiz(set,body,function(score,total){
      var p=progress[set.id]||{};
      progress[set.id]={done:true,best:Math.max(p.best||0,score),total:total};
      save(); paint(); paintTabs();
    });
  }});
  body.append(startBtn);
  paint();
  return h('div',{class:'card'},
    h('div',{class:'between'},h('h3',{text:set.title}),status),
    h('p',{class:'small',text:set.intro}),
    body
  );
}

function viewModule(m){
  var page=h('section',{class:'stack'});
  page.append(h('div',{class:'mod-head'},h('div',{},h('p',{class:'eyebrow',text:m.eyebrow}),h('h2',{text:m.name}),h('p',{class:'lede',text:m.lead})),illu('i-'+m.id,'icon')));
  page.append(h('div',{class:'card'},h('h3',{text:'要点'}),h('ul',{class:'points'},m.points.map(function(p){return h('li',{text:p});}))));
  if(FIG[m.id]){
    page.append(h('div',{class:'card'},h('h3',{text:FIG[m.id][1]}),illu(FIG[m.id][0],'wide')));
  }
  if(m.extra){
    page.append(h('div',{class:'card'},h('h3',{text:m.extra.title}),h('ul',{class:'points'},m.extra.items.map(function(p){return h('li',{text:p});}))));
  }
  m.sets.forEach(function(s){ page.append(setCard(s)); });
  if(m.id==='work'){
    page.append(h('div',{class:'row'},h('button',{type:'button',class:'btn',text:'面接シミュレーションへ',onclick:function(){ go('sim'); }})));
  }
  return page;
}

function viewSim(){
  var page=h('section',{class:'stack'});
  page.append(
    h('div',{class:'mod-head'},h('div',{},h('p',{class:'eyebrow',text:'通して試す'}),h('h2',{text:'面接シミュレーション'})),illu('i-sim','icon')),
    h('div',{class:'card'},
      illu('room','room-ill'),
      h('p',{text:SIM.intro}),
      h('p',{class:'small',style:'margin-top:8px',text:'目安は、介入のあとで患者の連想が広がったかどうか。メーターが長いほど、話が具体的で豊かになっています。'})
    )
  );
  var records=[];
  var stage=h('div',{class:'stack'});
  page.append(stage);

  function showTurn(i){
    var turn=SIM.turns[i];
    var total=SIM.turns.length;
    var card=h('div',{class:'card stack'});
    var opts=h('div',{class:'opts'});
    var after=h('div',{class:'stack'});
    var answered=false;
    card.append(
      h('div',{class:'qhead'},h('span',{text:'場面'}),h('span',{text:(i+1)+' / '+total})),
      leadBlock({who:'patient',lead:turn.patient}),
      h('p',{class:'q',text:'治療者として、どう応えますか。'}),
      opts, after
    );
    var btns=[];
    shuffle(turn.opts).forEach(function(o){
      var b=h('button',{type:'button',class:'opt',text:o.t});
      btns.push(b);
      b.addEventListener('click',function(){
        if(answered) return;
        answered=true;
        btns.forEach(function(x){ x.disabled=true; });
        b.classList.add('is-chosen');
        b.classList.add(o.s>=1?'is-ok':o.s<=-1?'is-miss':'is-chosen');
        records.push({patient:turn.patient,t:o.t,tag:o.tag,lv:o.s+3});
        var others=turn.opts.filter(function(x){return x!==o;});
        after.append(
          h('div',{class:'row'},h('span',{class:'tag',text:o.tag})),
          h('div',{class:'reply'},
            leadBlock({who:'patient',lead:o.reply}),
            h('div',{class:'row'},h('span',{class:'small',text:'連想の広がり'}),meter(o.s+3))
          ),
          h('p',{class:'note',text:o.note}),
          h('details',{class:'more'},
            h('summary',{text:'ほかの選択肢と、その後の反応'}),
            h('ul',{},others.map(function(x){
              return h('li',{},
                h('div',{class:'row'},h('span',{class:'tag',text:x.tag}),meter(x.s+3)),
                h('p',{style:'margin-top:6px',text:'治療者：'+x.t}),
                h('p',{class:'small',text:'患者：'+x.reply}),
                h('p',{class:'note',text:x.note})
              );
            }))
          ),
          h('div',{class:'row'},h('button',{type:'button',class:'btn',text:i<total-1?'次の場面へ':'ふりかえる',onclick:function(){
            if(i<total-1) showTurn(i+1); else showSummary();
          }}))
        );
      });
      opts.append(b);
    });
    stage.append(card);
    if(i>0) card.scrollIntoView({block:'start'});
  }

  function showSummary(){
    var sum=records.reduce(function(a,r){return a+r.lv;},0);
    var avg=sum/records.length;
    var msg=avg>=4.2?'どの場面でも、患者の仕事が増える方向に動けました。'
      :avg>=3.4?'広がった場面と、止まった場面がありました。止まった場面の介入を、5つの型で言い直してみてください。'
      :'患者の連想が細くなる場面が続きました。治療者が先に答えを出していないか、点検してみてください。';
    var card=h('div',{class:'card stack'},
      h('p',{class:'small',text:'ふりかえり'}),
      h('div',{class:'score',text:avg.toFixed(1)+' / 5'}),
      h('p',{text:msg}),
      h('ul',{class:'timeline'},records.map(function(r,k){
        return h('li',{},
          h('span',{class:'tl-t',text:'場面'+(k+1)+'　'+r.tag}),
          meter(r.lv)
        );
      })),
      h('p',{class:'small',text:'平均は、連想の広がりを5段階で見たものです。診断や評価の指標ではなく、振り返りのための目安です。'}),
      h('div',{class:'row'},
        h('button',{type:'button',class:'btn',text:'もう一度',onclick:function(){ go('sim'); }}),
        h('button',{type:'button',class:'btn ghost',text:'はじめに戻る',onclick:function(){ go('home'); }})
      )
    );
    stage.append(card);
    progress.sim={done:true,avg:avg};
    save(); paintTabs();
    card.scrollIntoView({block:'start'});
  }

  showTurn(0);
  return page;
}

go('home');
})();
</script>
